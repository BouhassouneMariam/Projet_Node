<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSPark - Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Page de connexion -->
    <div id="auth-page" class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="logo">
                    <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
                        <circle cx="25" cy="25" r="23" stroke="#6366f1" stroke-width="4"/>
                        <path d="M15 25L22 32L35 18" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1>TSPark</h1>
                </div>
                <p class="auth-subtitle">Plateforme de défis fitness</p>
                
                <!-- Formulaire de connexion -->
                <form id="login-form" style="display: block;">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="admin@gym.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" value="Admin123!" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
                </form>

                <!-- Formulaire d'inscription -->
                <form id="register-form" style="display: none;">
                    <div class="form-group">
                        <label for="reg-firstname">Prénom</label>
                        <input type="text" id="reg-firstname" name="firstname" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-lastname">Nom</label>
                        <input type="text" id="reg-lastname" name="lastname" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Mot de passe (min 8 caractères)</label>
                        <input type="password" id="reg-password" name="password" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="reg-role">Rôle</label>
                        <select id="reg-role" name="role" required>
                            <option value="member">Membre</option>
                            <option value="manager">Manager</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
                </form>

                <!-- Toggle entre connexion et inscription -->
                <div class="auth-toggle">
                    <p id="toggle-text">Pas encore de compte ? <a href="#" id="toggle-link">Créer un compte</a></p>
                </div>

                <div class="test-accounts" id="test-accounts">
                    <p>Comptes de test :</p>
                    <div class="account-chips">
                        <button class="chip" onclick="fillCredentials('admin@gym.com', 'Admin123!')">
                            Admin
                        </button>
                        <button class="chip" onclick="fillCredentials('jean.manager@gym.com', 'Manager123!')">
                            Manager
                        </button>
                        <button class="chip" onclick="fillCredentials('marie.dupont@gym.com', 'Member123!')">
                            Member
                        </button>
                    </div>
                </div>

                <div id="auth-error" class="error-message" style="display: none;"></div>
                <div id="auth-success" class="success-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Dashboard principal -->
    <div id="dashboard" class="dashboard" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg width="30" height="30" viewBox="0 0 50 50" fill="none">
                    <circle cx="25" cy="25" r="23" stroke="white" stroke-width="4"/>
                    <path d="M15 25L22 32L35 18" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>TSPark</span>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="users">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    Utilisateurs
                </a>

                <a href="#" class="nav-item" data-page="gyms">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                    Salles
                </a>

                <a href="#" class="nav-item" data-page="exercises">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    Exercices
                </a>

                <a href="#" class="nav-item" data-page="challenges">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Défis
                </a>

                <a href="#" class="nav-item" data-page="badges">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="7"></circle>
                        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                    </svg>
                    Badges
                </a>

                <a href="#" class="nav-item" data-page="badgeRules">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Règles Badges
                </a>

                <a href="#" class="nav-item" data-page="trainings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Entraînements
                </a>

                <a href="#" class="nav-item" data-page="scores">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    Classement
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-logout" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Déconnexion
                </button>
            </div>
        </aside>

        <!-- Contenu principal -->
        <main class="main-content">
            <header class="header">
                <h2 id="page-title">Utilisateurs</h2>
                <div class="user-info">
                    <span id="current-user-email"></span>
                </div>
            </header>

            <div id="content-area" class="content-area">
                <!-- Le contenu sera chargé dynamiquement -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
