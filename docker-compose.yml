# DOCKER COMPOSE - TSPARK PROJECT

services:
  # SERVICE WEB (Node.js + Express + TypeScript)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tspark-api
    restart: unless-stopped
    ports:
      - "${NODE_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/${MONGO_DB}?authSource=admin"
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules 
    command: sh -c "npm run build && npm run dev"
    networks:
      - tspark-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SERVICE MONGODB
  mongo:
    image: mongo:6.0
    container_name: tspark-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-example}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tspark}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - tspark-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/${MONGO_DB} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # SERVICE MONGO EXPRESS (Interface Web MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: tspark-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-example}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASS:-example}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:-pass}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tspark-network

# VOLUMES
volumes:
  mongo-data:
    name: tspark-mongo-data
    driver: local
  mongo-config:
    name: tspark-mongo-config
    driver: local
  node_modules:
    name: tspark-node-modules
    driver: local
    
# RÉSEAUX
networks:
  tspark-network:
    name: tspark-network
    driver: bridge